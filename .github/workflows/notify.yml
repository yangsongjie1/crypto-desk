name: 盯盘提醒
on:
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: notify
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 计算信号并推送
        run: node notify.js
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
      - name: 保存状态
        run: |
          if [ -n "$(git status --porcelain state.json alerts.json)" ]; then
            git config user.name "crypto-desk-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            [ -f alerts.json ] && git add alerts.json
            git commit -m "更新盯盘状态"
            git push
          fi
