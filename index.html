<script>
(function ENGINE() {
const TF_MS = { "1d": 86400000, "4h": 14400000, "30m": 1800000, "5m": 300000 };
const WARMUP = 200;
function ema(x, n) {
  const a = 2 / (n + 1), o = new Float64Array(x.length);

}
function rsi(c, n = 14) {

  const L = c.length, o = new Float64Array(L), a = 1 / n;

    const tr = i === 0 ? h[0] - l[0]

function rollPrev(x, n, fn) {
  const L = x.length, o = new Float64Array(L).fill(NaN);
  for (let i = n; i < L; i++) {

    for (let j = i - n + 1; j < i; j++) v = fn(v, x[j]);
    o[i] = v;

  return o;
}
function supertrend(h, l, c, n = 10, mult = 3) {
  const L = c.length, a = atr(h, l, c, n);
  const ub = new Float64Array(L), lb = new Float64Array(L), d = new Int8Array(L).fill(1);
  for (let i = 0; i < L; i++) { const m = (h[i] + l[i]) / 2; ub[i] = m + mult * a[i]; lb[i] = m - mult * a[i]; }
  const fub = Float64Array.from(ub), flb = Float64Array.from(lb);

    fub[i] = (ub[i] < fub[i - 1] || c[i - 1] > fub[i - 1]) ? ub[i] : fub[i - 1];
    flb[i] = (lb[i] > flb[i - 1] || c[i - 1] < flb[i - 1]) ? lb[i] : flb[i - 1];
    if (d[i - 1] === -1 && c[i] > fub[i - 1]) d[i] = 1;
    else if (d[i - 1] === 1 && c[i] < flb[i - 1]) d[i] = -1;

}
function prepare(k) {
  const { h, l, c } = k;

  const hh20 = rollPrev(h, 20, Math.max), ll10 = rollPrev(l, 10, Math.min), ll20 = rollPrev(l, 20, Math.min);

}
const STRATEGIES = [
  { id: "ema_trend",
    fn(c, I) {

  else if (d.fcancel) { S.fillEdit = null; S.closeEdit = null; render(); }
  else if (d.fsave) {
    const k = d.fsave, q = sel => document.querySelector(`[${sel}="${CSS.escape(k)}"]`), num = el => el && el.value !== "" ? parseFloat(el.value) : null;
    const f = S.fills[k] || (() => { const [fb, fsys, ft] = k.split("|"); return { b: fb, sys: fsys, side: fsys === "trend" ? 1 : -1, t: +ft || Date.now() }; })();
    const e = num(q("data-fe")), qty = num(q("data-fq")), x = num(q("data-fx"));
    if (e > 0) f.entry = e; f.qty = qty > 0 ? qty : null; if (x > 0) f.exit = x;
    f.est = 0; f.u = Date.now(); S.fills[k] = f; S.fillEdit = null; save("fills", S.fills); render();
  }
  else if (d.close) { S.closeEdit = d.close; S.fillEdit = null; render(); }
  else if (d.xsave) {
    const k = d.xsave, el = document.querySelector(`[data-fx="${CSS.escape(k)}"]`), x = el && parseFloat(el.value) > 0 ? parseFloat(el.value) : +d.px;
    const [fb, fsys, ft] = k.split("|");
    const f = S.fills[k] || { b: fb, sys: fsys, side: fsys === "trend" ? 1 : -1, entry: null, qty: null, t: +ft || Date.now(), est: 1 };
    Object.assign(f, { exit: x, exitT: Date.now(), u: Date.now() });
    if (!(f.entry > 0)) { const v = fsys === "trend" ? trendFor(fb) : swingFor(fb), o = v?.open; f.entry = o && o.t0 === +ft ? o.p0 : (v?.trades.find(t => t.t0 === +ft)?.p0 ?? x); }
    S.fills[k] = f; S.follow[k] = 2; S.closeEdit = null; save("fills", S.fills); save("follow", S.follow); render();
  }
  else if (d.fdel) { if (S.delAsk === d.fdel) { delete S.fills[d.fdel]; S.delAsk = null; save("fills", S.fills); } else S.delAsk = d.fdel; render(); }
  else if (d.syncCopy) {
    const url = PAGE_URL + "#sync=" + syncCode();
    S.syncOut = ""; S.syncMsg = "";
    (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(() => { S.syncMsg = "同步链接已复制。发到另一台设备上打开，或粘贴到那边的「导入」框里。"; render(); }, () => { S.syncOut = url; render(); });
  }
  else if (d.syncImport) {
    const el = document.querySelector("[data-sync-in]");
    try { const n = importSync(el ? el.value : ""); S.syncMsg = `导入成功，合并了 ${n} 条记录。`; } catch (e) { S.syncMsg = "同步码不完整，导入失败。请重新复制整段链接。"; }
    S.syncOut = ""; render();
  }
  else if (d.old) { S.oldOpen = !S.oldOpen; render(); }
  else if (d.diag) diagnose();
});
document.addEventListener("change", e => {
  const k = e.target.dataset.pref; if (!k) return;
  const v = parseFloat(e.target.value);
  if (v > 0) { S.prefs[k] = v; save("prefs", S.prefs); }
});
let lastCandles = 0;
async function tick() {
  await refreshTicker();
  if (Date.now() - lastCandles > 60000 && S.progress.done >= S.progress.total) { lastCandles = Date.now(); await refreshCandles(); }
}
async function boot() {
  checkHashSync(); applyColors(); render();
  for (;;) {
    await refreshTicker();
    if (S.srcOk) break;
    render();
    await new Promise(r => setTimeout(r, 30000));
  }
  loadAlerts(); setInterval(loadAlerts, 120000);
  await loadAllHistory();
  lastCandles = Date.now();
  render();
  setInterval(tick, 20000);
  setInterval(render, 30000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });
}
boot();
})();
</script>
